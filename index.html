<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Image Quiz</h1>

        <div class="card">
            <img id="quiz-image" src="" alt="Quiz Image">
            
            <p id="description" class="hidden"></p>

            <div class="buttons">
                <button id="reveal-btn">Reveal Description</button>
                <button id="next-btn">Next Image</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
